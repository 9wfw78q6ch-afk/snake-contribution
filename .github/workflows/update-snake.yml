name: Update Snake Game

on:
  schedule:
    - cron: '0 0 * * *'   # každý den v midnight UTC
  workflow_dispatch:       # ruční trigger z GitHub Actions UI

permissions:
  contents: write

jobs:
  update-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate snake SVG
        uses: Platane/snk@master
        with:
          github_user_name: 9wfw78q6ch-afk
          outputs: |
            snake.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update snake game" && git push)
